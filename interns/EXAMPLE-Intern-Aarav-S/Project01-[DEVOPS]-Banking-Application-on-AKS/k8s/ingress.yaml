apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cbc-banking-app-ingress
  annotations:
    # Application Gateway Ingress Controller (AGIC) on AKS
    kubernetes.io/ingress.class: azure/application-gateway
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cbc-banking-app-service
                port:
                  number: 80
