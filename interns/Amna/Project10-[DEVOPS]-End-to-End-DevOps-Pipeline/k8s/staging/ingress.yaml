apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-capstone-webapp
  namespace: staging
spec:
  ingressClassName: traefik
  rules:
  - host: capstone.local
    http:
      paths:
      - backend:
          service:
            name: devops-capstone-webapp
            port:
              number: 80
        path: /
        pathType: Prefix
status:
  loadBalancer: {}
