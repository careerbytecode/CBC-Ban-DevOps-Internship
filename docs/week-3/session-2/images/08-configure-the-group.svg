<rect x="28" y="168" width="1124" height="460" fill="#FFFFFF" rx="0" stroke="#D3DAE0" stroke-width="1"/>
<text x="70" y="210" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Group type *</text>
<rect x="70" y="218" width="420" height="26" fill="#FFFFFF" rx="3" stroke="#D3DAE0" stroke-width="1"/>
<text x="80" y="235" font-size="11.5" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Security</text>
<text x="476" y="235" font-size="10" fill="#5B6773" font-weight="400" text-anchor="middle" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">▾</text>
<text x="70" y="264" font-size="10" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Security — usable as an Azure RBAC principal.</text>
<text x="70" y="270" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Group name *</text>
<rect x="70" y="278" width="420" height="26" fill="#FFFFFF" rx="3" stroke="#D3DAE0" stroke-width="1"/>
<text x="80" y="295" font-size="11.5" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">DevOps-Team</text>
<text x="70" y="316" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Group description</text>
<rect x="70" y="324" width="420" height="26" fill="#FFFFFF" rx="3" stroke="#D3DAE0" stroke-width="1"/>
<text x="80" y="341" font-size="11.5" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">DevOps Security Group</text>
<text x="70" y="362" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Microsoft Entra roles can be assigned to the group</text>
<rect x="70" y="370" width="420" height="26" fill="#FFFFFF" rx="3" stroke="#D3DAE0" stroke-width="1"/>
<text x="80" y="387" font-size="11.5" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">No</text>
<text x="476" y="387" font-size="10" fill="#5B6773" font-weight="400" text-anchor="middle" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">▾</text>
<text x="70" y="416" font-size="10" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Leave as No — not needed for Azure resource RBAC.</text>
<text x="70" y="422" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Membership type *</text>
<rect x="70" y="430" width="420" height="26" fill="#FFFFFF" rx="3" stroke="#D3DAE0" stroke-width="1"/>
<text x="80" y="447" font-size="11.5" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Assigned</text>
<text x="476" y="447" font-size="10" fill="#5B6773" font-weight="400" text-anchor="middle" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">▾</text>
<text x="70" y="476" font-size="10" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Assigned = you pick members manually. Dynamic = rule-driven.</text>
<text x="670" y="210" font-size="13" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Members</text>
<rect x="670" y="222" width="420" height="90" fill="#F7F8FA" rx="3" stroke="#D3DAE0" stroke-width="1" stroke-dasharray="4 3"/>
<text x="682" y="250" font-size="11.5" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">No members selected</text>
<text x="682" y="272" font-size="10.5" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">You can add them here, or afterwards from</text>
<text x="682" y="288" font-size="10.5" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">the group's Members blade (Step 11).</text>
<rect x="670" y="336" width="420" height="96" fill="#EEF5FB" rx="4" stroke="#0F6CBD" stroke-width="1"/>
<rect x="670" y="336" width="3.5" height="96" fill="#0F6CBD" rx="2"/>
<text x="684" y="356" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Why assign roles to a group, never to a user</text>
<text x="684" y="372" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">The role assignment is written once, against the group.</text>
<text x="684" y="388" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Onboarding or offboarding an engineer then becomes a</text>
<text x="684" y="404" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">membership change — no permission edits, no drift, and one</text>
<text x="684" y="420" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">place to audit who holds what.</text>
