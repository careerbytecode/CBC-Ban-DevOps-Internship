<text x="786" y="412" font-size="10.8" fill="#7FD4A0" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">$ az account show \</text>
<text x="786" y="429" font-size="10.8" fill="#7FD4A0" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">$   --query user.name -o tsv</text>
<text x="786" y="446" font-size="10.8" fill="#C6D2DB" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  devuser01@yourtenant.onmi…</text>
<text x="786" y="463" font-size="10.8" fill="#7A8894" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  </text>
<text x="786" y="480" font-size="10.8" fill="#C6D2DB" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  CLI is now acting as the</text>
<text x="786" y="497" font-size="10.8" fill="#C6D2DB" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  Entra ID user, not the admin.</text>
