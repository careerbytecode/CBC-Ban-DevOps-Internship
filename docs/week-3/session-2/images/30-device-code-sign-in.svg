<circle cx="44" cy="97" r="4.5" fill="#E06C60"/>
<circle cx="58" cy="97" r="4.5" fill="#E3B341"/>
<circle cx="72" cy="97" r="4.5" fill="#4FA96A"/>
<text x="98" y="101" font-size="10.5" fill="#8FA0AD" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">WSL / MobaXterm — bash</text>
<text x="44" y="130" font-size="10.8" fill="#7FD4A0" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">$ az login --use-device-code</text>
<text x="44" y="147" font-size="10.8" fill="#7A8894" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  </text>
<text x="44" y="164" font-size="10.8" fill="#F0B860" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  To sign in, use a web browser to open the page</text>
<text x="44" y="181" font-size="10.8" fill="#F0B860" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  https://microsoft.com/devicelogin and enter the</text>
<text x="44" y="198" font-size="10.8" fill="#F0B860" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  code F7QK9XZ4T to authenticate.</text>
<text x="44" y="215" font-size="10.8" fill="#7A8894" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  </text>
<text x="44" y="232" font-size="10.8" fill="#C6D2DB" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  Waiting for the sign-in to complete...</text>
