<text x="76" y="496" font-size="11.5" fill="#0F6CBD" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">+  Use another account</text>
<text x="52" y="538" font-size="10" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">If the intended user is not listed, choose</text>
<text x="52" y="552" font-size="10" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">“Use another account” and sign in explicitly.</text>
