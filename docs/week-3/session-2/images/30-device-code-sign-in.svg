<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-label="Step 28a — Authenticate the CLI as the Entra ID user" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8501E"/></marker></defs>
<rect x="0" y="0" width="1160" height="620" fill="#FFFFFF" rx="0"/>
<text x="28" y="34" font-size="17" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Step 28a — Authenticate the CLI as the Entra ID user</text>
<text x="28" y="55" font-size="12.5" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">az login uses a device code when the terminal cannot open a browser.</text>
<rect x="28" y="84" width="600" height="250" fill="#10171E" rx="6" stroke="#2A3640" stroke-width="1"/>
<rect x="28" y="84" width="600" height="26" fill="#1D2830" rx="6"/>
