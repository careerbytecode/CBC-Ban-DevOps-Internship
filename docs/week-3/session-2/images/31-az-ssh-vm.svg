<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" role="img" aria-label="Step 28b — Connect with az ssh vm" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8501E"/></marker></defs>
<rect x="0" y="0" width="1160" height="520" fill="#FFFFFF" rx="0"/>
<text x="28" y="34" font-size="17" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Step 28b — Connect with az ssh vm</text>
<text x="28" y="55" font-size="12.5" fill="#5B6773" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Entra ID credentials are exchanged for a short-lived SSH certificate.</text>
<rect x="28" y="84" width="620" height="300" fill="#10171E" rx="6" stroke="#2A3640" stroke-width="1"/>
<rect x="28" y="84" width="620" height="26" fill="#1D2830" rx="6"/>
<rect x="28" y="102" width="620" height="8" fill="#1D2830" rx="0"/>
<circle cx="44" cy="97" r="4.5" fill="#E06C60"/>
<circle cx="58" cy="97" r="4.5" fill="#E3B341"/>
<circle cx="72" cy="97" r="4.5" fill="#4FA96A"/>
<text x="98" y="101" font-size="10.5" fill="#8FA0AD" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">WSL / MobaXterm — bash</text>
<text x="44" y="130" font-size="10.8" fill="#7FD4A0" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">$ az ssh vm \</text>
<text x="44" y="147" font-size="10.8" fill="#7FD4A0" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">$   --resource-group cbc-internship-program \</text>
<text x="44" y="164" font-size="10.8" fill="#7FD4A0" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">$   --name cbc-vm</text>
<text x="44" y="181" font-size="10.8" fill="#7A8894" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  </text>
<text x="44" y="198" font-size="10.8" fill="#C6D2DB" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  Generating a temporary SSH certificate...</text>
<text x="44" y="215" font-size="10.8" fill="#C6D2DB" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  Warning: Permanently added '20.x.x.x' to known hosts.</text>
<text x="44" y="232" font-size="10.8" fill="#7A8894" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  </text>
<text x="44" y="249" font-size="10.8" fill="#C6D2DB" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  Welcome to Ubuntu 24.04 LTS (GNU/Linux x86_64)</text>
<text x="44" y="266" font-size="10.8" fill="#7A8894" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  </text>
<text x="44" y="283" font-size="10.8" fill="#7FD4A0" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">$ whoami</text>
<text x="44" y="300" font-size="10.8" fill="#C6D2DB" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  devuser01@yourtenant.onmicrosoft.com</text>
<text x="44" y="317" font-size="10.8" fill="#7FD4A0" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">$ sudo -l</text>
<text x="44" y="334" font-size="10.8" fill="#E88A7D" font-weight="400" text-anchor="start" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">  Sorry, user is not allowed to run sudo on cbc-vm.</text>
<circle cx="40" cy="118" r="11" fill="#C8501E" stroke="#FFFFFF" stroke-width="2"/>
<text x="40" y="122" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">1</text>
<circle cx="40" cy="254" r="11" fill="#C8501E" stroke="#FFFFFF" stroke-width="2"/>
<text x="40" y="258" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">2</text>
<circle cx="40" cy="322" r="11" fill="#C8501E" stroke="#FFFFFF" stroke-width="2"/>
<text x="40" y="326" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">3</text>
<rect x="680" y="110" width="450" height="96" fill="#EDF7F1" rx="4" stroke="#107C41" stroke-width="1"/>
<rect x="680" y="110" width="3.5" height="96" fill="#107C41" rx="2"/>
<text x="694" y="130" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Why sudo is refused</text>
<text x="694" y="146" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">The group holds Virtual Machine User Login, which maps to a</text>
<text x="694" y="162" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">standard OS user. Virtual Machine Administrator Login is the</text>
<text x="694" y="178" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">role that maps to root / local administrator — this failure is</text>
<text x="694" y="194" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">the proof that least privilege is working end to end.</text>
<rect x="680" y="236" width="450" height="80" fill="#EEF5FB" rx="4" stroke="#0F6CBD" stroke-width="1"/>
<rect x="680" y="236" width="3.5" height="80" fill="#0F6CBD" rx="2"/>
<text x="694" y="256" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Prerequisites for az ssh vm</text>
<text x="694" y="272" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">1.  Azure CLI plus the ssh extension installed locally.</text>
<text x="694" y="288" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">2.  The AADSSHLoginForLinux extension installed on the VM.</text>
<text x="694" y="304" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">3.  Port 22 reachable from where you are running the command.</text>
<rect x="680" y="356" width="450" height="80" fill="#FDF6E9" rx="4" stroke="#B26B00" stroke-width="1"/>
<rect x="680" y="356" width="3.5" height="80" fill="#B26B00" rx="2"/>
<text x="694" y="376" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">No local key, no shared password</text>
<text x="694" y="392" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">The certificate is minted per session and expires by itself. Nothing</text>
<text x="694" y="408" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">durable is stored on the VM, so revoking access is a group</text>
<text x="694" y="424" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">membership removal — not a key rotation exercise.</text>
<text x="1136" y="508" font-size="9.5" fill="#9AA7B2" font-weight="400" text-anchor="end" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">CareerByteCode • Schematic diagram — not an actual screenshot</text>
</svg>