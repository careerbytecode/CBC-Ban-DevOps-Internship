<text x="84" y="354.0" font-size="11" fill="#0F6CBD" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Virtual Machine Administrator Login</text>
<text x="424" y="354.0" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">View VMs and log in as a Windows/Linux administrator.</text>
<text x="984" y="354.0" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">BuiltInRole</text>
<rect x="72" y="366" width="1032" height="32" fill="#FFFFFF" rx="0" stroke="#D3DAE0" stroke-width="1"/>
<text x="84" y="386.0" font-size="11" fill="#0F6CBD" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Virtual Machine User Login</text>
<text x="424" y="386.0" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">View VMs and log in as a regular user.</text>
<text x="984" y="386.0" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">BuiltInRole</text>
<rect x="72" y="398" width="1032" height="32" fill="#FFFFFF" rx="0" stroke="#D3DAE0" stroke-width="1"/>
<text x="84" y="418.0" font-size="11" fill="#0F6CBD" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Virtual Machine Contributor</text>
<text x="424" y="418.0" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Manage VMs — but not the VNet or the OS inside them.</text>
<text x="984" y="418.0" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">BuiltInRole</text>
<rect x="72" y="430" width="1032" height="32" fill="#FFFFFF" rx="0" stroke="#D3DAE0" stroke-width="1"/>
<text x="84" y="450.0" font-size="11" fill="#0F6CBD" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Network Contributor</text>
<text x="424" y="450.0" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Manage networking resources (VNet, NSG, public IP).</text>
<text x="984" y="450.0" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">BuiltInRole</text>
