<rect x="72" y="470" width="620" height="96" fill="#EEF5FB" rx="4" stroke="#0F6CBD" stroke-width="1"/>
<rect x="72" y="470" width="3.5" height="96" fill="#0F6CBD" rx="2"/>
<text x="86" y="490" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Administrator Login vs User Login</text>
<text x="86" y="506" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Both let the principal see the VM and sign in with an Entra ID</text>
<text x="86" y="522" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">identity. Administrator Login additionally grants root / local</text>
<text x="86" y="538" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">administrator rights on the guest OS. Pick User Login unless the</text>
<text x="86" y="554" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">intern genuinely needs sudo — that is least privilege in practice.</text>
<rect x="716" y="470" width="388" height="80" fill="#EDF7F1" rx="4" stroke="#107C41" stroke-width="1"/>
<rect x="716" y="470" width="3.5" height="80" fill="#107C41" rx="2"/>
<text x="730" y="490" font-size="11" fill="#16202B" font-weight="600" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">Data actions, not control-plane actions</text>
<text x="730" y="506" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">These two roles carry dataActions. They authorize the sign-in</text>
<text x="730" y="522" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">itself, which is why the VM must also have the Entra ID login</text>
<text x="730" y="538" font-size="11" fill="#16202B" font-weight="400" text-anchor="start" font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">extension installed and AAD auth enabled.</text>
