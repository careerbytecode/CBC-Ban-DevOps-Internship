apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbc-app
  labels:
    app: cbc-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cbc-app
  template:
    metadata:
      labels:
        app: cbc-app
    spec:
      containers:
        - name: cbc-app
          # Replace <your-acr-name> with your Azure Container Registry name
          image: <your-acr-name>.azurecr.io/cbc-app:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: cbc-app-config
            - secretRef:
                name: cbc-app-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
